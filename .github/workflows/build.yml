name: Build Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    # 下载完整词典并只保留 word + translation 两列
    - name: Prepare full offline dictionary
      shell: bash
      run: |
        echo "下载原始词典并精简字段..."
        python -c "
        import csv, urllib.request, io

        url = 'https://raw.githubusercontent.com/skywind3000/ECDICT/master/ecdict.csv'
        response = urllib.request.urlopen(url)
        # 用 TextIOWrapper 避免二进制流解码问题
        reader = csv.reader(io.TextIOWrapper(response, encoding='utf-8'))

        # 读取第一行获取列名
        header = next(reader)
        word_idx = header.index('word')
        translation_idx = header.index('translation')

        with open('local_dict.csv', 'w', encoding='utf-8', newline='') as f:
            writer = csv.writer(f)
            count = 0
            for row in reader:
                if len(row) > max(word_idx, translation_idx):
                    writer.writerow([row[word_idx].strip(), row[translation_idx].strip()])
                    count += 1
                if count % 100000 == 0:
                    print(f'已处理 {count} 条...')
        print(f'精简词典完成，共 {count} 条记录')
        "

    # Windows 打包（注意分号分隔 add-data）
    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --onefile --windowed --add-data "local_dict.csv;." --name "HoverTranslator" transhover.py

    # macOS/Linux 打包（冒号分隔 add-data）
    - name: Build with PyInstaller (macOS/Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --onefile --windowed --add-data "local_dict.csv:." --name "HoverTranslator" transhover.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HoverTranslator-${{ matrix.os }}
        path: dist/*
